<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-label="NG BEAUTY">
  <defs>
    <linearGradient id="bgabout1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231d16"/>
      <stop offset="55%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0f0d0a"/>
    </linearGradient>
    <radialGradient id="glowabout1" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#caa96a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#caa96a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampglow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#caa96a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#caa96a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#bgabout1)"/>
  <rect width="900" height="1100" fill="url(#glowabout1)"/>
  <rect x="18" y="18" width="864" height="1064" fill="none" stroke="#caa96a" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Scène épurée : coin studio (miroir, tabouret, guéridon, suspension) -->
  <g fill="none" stroke="#caa96a" stroke-linecap="round" stroke-linejoin="round">

    <!-- Suspension lumineuse -->
    <circle cx="470" cy="205" r="34" fill="url(#lampglow1)" stroke="none"/>
    <path d="M470 96 L470 178" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M441 178 Q470 158 499 178 L491 202 Q470 190 449 202 Z" stroke-opacity="0.75" stroke-width="1.5"/>

    <!-- Miroir sur pied -->
    <ellipse cx="470" cy="470" rx="150" ry="168" stroke-opacity="0.85" stroke-width="1.8"/>
    <ellipse cx="470" cy="470" rx="136" ry="154" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M470 638 L470 726" stroke-opacity="0.7" stroke-width="1.5"/>
    <path d="M424 792 L470 726 L516 792" stroke-opacity="0.7" stroke-width="1.5"/>
    <path d="M410 792 L530 792" stroke-opacity="0.7" stroke-width="1.5"/>

    <!-- Guéridon avec bougie -->
    <ellipse cx="702" cy="700" rx="66" ry="16" stroke-opacity="0.75" stroke-width="1.5"/>
    <path d="M650 706 L662 830" stroke-opacity="0.6" stroke-width="1.3"/>
    <path d="M754 706 L742 830" stroke-opacity="0.6" stroke-width="1.3"/>
    <path d="M648 830 L756 830" stroke-opacity="0.6" stroke-width="1.3"/>
    <rect x="692" y="662" width="16" height="34" rx="2" stroke-opacity="0.7" stroke-width="1.3"/>
    <path d="M700 662 Q696 648 700 638 Q704 648 700 662" stroke-opacity="0.75" stroke-width="1.2"/>

    <!-- Tabouret -->
    <ellipse cx="225" cy="742" rx="58" ry="18" stroke-opacity="0.75" stroke-width="1.5"/>
    <path d="M178 750 L160 872" stroke-opacity="0.6" stroke-width="1.3"/>
    <path d="M225 758 L222 872" stroke-opacity="0.6" stroke-width="1.3"/>
    <path d="M272 750 L288 872" stroke-opacity="0.6" stroke-width="1.3"/>

    <!-- Petite plante -->
    <path d="M652 792 L676 792 L672 838 L656 838 Z" stroke-opacity="0.7" stroke-width="1.3"/>
    <path d="M664 792 Q650 752 630 738" stroke-opacity="0.6" stroke-width="1.2"/>
    <path d="M664 792 Q664 744 664 720" stroke-opacity="0.6" stroke-width="1.2"/>
    <path d="M664 792 Q680 756 700 744" stroke-opacity="0.6" stroke-width="1.2"/>

    <!-- Ligne de sol, très discrète -->
    <path d="M130 872 L770 872" stroke-opacity="0.25" stroke-width="1"/>
  </g>
</svg>
